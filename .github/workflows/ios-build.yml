name: iOS Build (OpenPAL feasibility)

on:
  push:
    branches: [ios-feasibility]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly + iOS target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Install Vulkan SDK (glslc for shaders + MoltenVK)
        run: |
          curl -O https://sdk.lunarg.com/sdk/download/1.2.198.1/mac/vulkansdk-macos-1.2.198.1.dmg
          hdiutil attach vulkansdk-macos-1.2.198.1.dmg
          sudo /Volumes/vulkansdk-macos-1.2.198.1/InstallVulkan.app/Contents/MacOS/InstallVulkan --root "$HOME/VulkanSDK/1.2.198.1" --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=$HOME/VulkanSDK/1.2.198.1/macOS" >> "$GITHUB_ENV"
          echo "$HOME/VulkanSDK/1.2.198.1/macOS/bin" >> "$GITHUB_PATH"
          ls "$HOME/VulkanSDK/1.2.198.1" || true

      - name: Build yaobow for aarch64-apple-ios
        run: |
          source "$HOME/.cargo/env"
          cargo build -p yaobow --target aarch64-apple-ios --release 2>&1 | tee build.log | tail -60

      - name: Package unsigned IPA (best-effort)
        if: success()
        run: |
          set -e
          BIN="target/aarch64-apple-ios/release/yaobow"
          APP="Payload/yaobow.app"
          mkdir -p "$APP/Frameworks"
          cp "$BIN" "$APP/yaobow"
          chmod +x "$APP/yaobow"

          cat > "$APP/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>OpenPAL</string>
              <key>CFBundleDisplayName</key><string>OpenPAL</string>
              <key>CFBundleIdentifier</key><string>com.bikel.pal4</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>0.1</string>
              <key>CFBundleExecutable</key><string>yaobow</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
              <key>MinimumOSVersion</key><string>13.0</string>
          </dict>
          </plist>
          EOF

          cat > "$APP/LaunchScreen.storyboard" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0">
            <dependencies><plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="1"/></dependencies>
            <scenes><scene><objects><viewController id="v" sceneMemberID="viewController"/></objects></scene></scenes>
          </document>
          EOF

          # MoltenVK (iOS build) for runtime Vulkan loader
          MVK=$(find "$HOME/VulkanSDK" -path '*iOS*MoltenVK.framework*' -name MoltenVK 2>/dev/null | head -1)
          if [ -z "$MVK" ]; then
            MVK=$(find "$HOME/VulkanSDK" -name 'MoltenVK' -path '*MoltenVK.framework*' 2>/dev/null | head -1)
          fi
          echo "MoltenVK found: $MVK"
          if [ -n "$MVK" ]; then
            cp -R "$(dirname "$MVK")" "$APP/Frameworks/MoltenVK.framework"
            # ash (loaded feature) dlopen's libvulkan; MoltenVK implements the loader
            ln -sf MoltenVK.framework/MoltenVK "$APP/Frameworks/libvulkan.dylib"
          fi

          (cd Payload && zip -r -y ../OpenPAL-iOS-unsigned.ipa .)
          ls -la OpenPAL-iOS-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenPAL-iOS-unsigned
          path: OpenPAL-iOS-unsigned.ipa

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
