name: iOS build (feasibility - hand-packed unsigned IPA)

on:
  push:
    branches: [ios-feasibility]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (pinned nightly for OpenPAL) + aarch64-apple-ios target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2024-07-01
          source "$HOME/.cargo/env"
          rustup default nightly-2024-07-01
          rustup target add aarch64-apple-ios
          rustc --version && cargo --version

      - name: Install glslang (shader compile used by radiance build.rs)
        run: |
          brew install glslang || true
          which glslangValidator || echo "WARN: glslangValidator not found"

      - name: Build yaobow for aarch64-apple-ios (release)
        run: |
          set -o pipefail
          source "$HOME/.cargo/env"
          cargo build -p yaobow --target aarch64-apple-ios --release 2>&1 | tail -40
          BIN=$(find target/aarch64-apple-ios/release -maxdepth 1 -type f -name yaobow | head -1)
          echo "BIN=$BIN"
          [ -n "$BIN" ] || { echo "NO BINARY BUILT"; exit 1; }
          ls -la "$BIN"
          file "$BIN" || true

      - name: Hand-pack unsigned IPA
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          BIN=$(find target/aarch64-apple-ios/release -maxdepth 1 -type f -name yaobow | head -1)
          APP=Payload/yaobow.app
          rm -rf Payload "$APP"
          mkdir -p "$APP/Frameworks"
          cp "$BIN" "$APP/yaobow"
          chmod +x "$APP/yaobow"

          echo "=== packaging assets (submodule dir -> yaobow-assets.zip) ==="
          pushd yaobow/yaobow-assets
          zip -r "$GITHUB_WORKSPACE/$APP/yaobow-assets.zip" . -x '*.git*'
          popd
          ls -la "$APP/yaobow-assets.zip"

          echo "=== bundling MoltenVK (Vulkan loader for ash::Entry::load) ==="
          MV_URL=$(curl -fsSL https://api.github.com/repos/KhronosGroup/MoltenVK/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name']=='MoltenVK-ios.tar'][0])")
          echo "MV_URL=$MV_URL"
          curl -fSL -o /tmp/mvk.tar "$MV_URL"
          tar xf /tmp/mvk.tar -C /tmp
          MVDIR=$(find /tmp/MoltenVK -name 'libMoltenVK.dylib' 2>/dev/null | head -1)
          echo "MVDIR=$MVDIR"
          [ -n "$MVDIR" ] || { echo "ERR: libMoltenVK.dylib not found inside MoltenVK-ios.tar"; exit 1; }
          cp "$MVDIR" "$APP/Frameworks/libMoltenVK.dylib"
          cp "$MVDIR" "$APP/Frameworks/libvulkan.dylib"
          echo "bundled MoltenVK as libMoltenVK.dylib and libvulkan.dylib"
          ls -la "$APP/Frameworks"

          echo "=== add @executable_path/Frameworks rpath so dyld finds the bundled dylib ==="
          xcrun install_name_tool -add_rpath @executable_path/Frameworks "$APP/yaobow" || echo "WARN: add_rpath failed"
          xcrun otool -l "$APP/yaobow" | grep -A2 LC_RPATH || true

          echo "=== Info.plist ==="
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>yaobow</string>
            <key>CFBundleDisplayName</key><string>仙剑 iOS (feasibility)</string>
            <key>CFBundleIdentifier</key><string>com.bikeltech.yaobow</string>
            <key>CFBundleExecutable</key><string>yaobow</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>MinimumOSVersion</key><string>12.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>metal</string><string>vulkan</string></array>
            <key>UILaunchScreen</key><dict></dict>
            <key>UIApplicationSupportsIndirectInputEvents</key><true/>
            <key>UISupportedInterfaceOrientations</key>
              <array>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
                <string>UIInterfaceOrientationPortrait</string>
              </array>
            <key>UIBackgroundModes</key><array><string>game</string></array>
          </dict>
          </plist>
          PLIST

          echo "=== .app contents ==="
          ls -laR "$APP" | head -60

          zip -r yaobow-unsigned.ipa Payload
          ls -la yaobow-unsigned.ipa

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaobow-ios-unsigned
          path: yaobow-unsigned.ipa
          if-no-files-found: warn
