name: iOS build (feasibility - compile)

on:
  push:
    branches: [ios-feasibility]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly + aarch64-apple-ios target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version && cargo --version

      - name: Install glslang (provides glslangValidator for shader compilation)
        run: |
          # glslc (Vulkan SDK) is preferred by build.rs; glslangValidator is the
          # Homebrew-provided fallback that build.rs uses when glslc is absent.
          brew install glslang
          which glslangValidator || echo "WARN: glslangValidator not found"

      - name: Build yaobow for aarch64-apple-ios (release)
        run: |
          source "$HOME/.cargo/env"
          cargo build -p yaobow --target aarch64-apple-ios --release 2>&1 | tee build.log | tail -80

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
