name: iOS build (feasibility - hand-packed unsigned IPA)

on:
  push:
    branches: [ios-feasibility]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (pinned nightly for OpenPAL) + aarch64-apple-ios target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2024-07-01
          source "$HOME/.cargo/env"
          rustup default nightly-2024-07-01
          rustup target add aarch64-apple-ios
          rustc --version && cargo --version

      - name: Install glslang (shader compile used by radiance build.rs)
        run: |
          brew install glslang || true
          which glslangValidator || echo "WARN: glslangValidator not found"

      - name: Build yaobow for aarch64-apple-ios (release)
        run: |
          set -o pipefail
          source "$HOME/.cargo/env"
          cargo build -p yaobow --target aarch64-apple-ios --release 2>&1 | tail -40
          BIN=$(find target/aarch64-apple-ios/release -maxdepth 1 -type f -name yaobow | head -1)
          echo "BIN=$BIN"
          [ -n "$BIN" ] || { echo "NO BINARY BUILT"; exit 1; }
          ls -la "$BIN"
          file "$BIN" || true

      - name: Hand-pack unsigned IPA
        run: |
          set -o pipefail
          source "$HOME/.cargo/env"
          BIN=$(find target/aarch64-apple-ios/release -maxdepth 1 -type f -name yaobow | head -1)
          APP=Payload/yaobow.app
          rm -rf Payload "$APP"
          mkdir -p "$APP/Frameworks"
          cp "$BIN" "$APP/yaobow"
          chmod +x "$APP/yaobow"

          echo "=== locating asset zips ==="
          find . -name '*-assets.zip' 2>/dev/null | tee /tmp/assetzips.txt
          while read -r z; do
            [ -n "$z" ] || continue
            echo "copying asset: $z"
            cp "$z" "$APP/" || echo "WARN copy failed: $z"
          done < /tmp/assetzips.txt

          echo "=== bundling MoltenVK (libvulkan for ash::loaded dlopen) ==="
          curl -fSL -o /tmp/mvk.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar || \
          curl -fSL -o /tmp/mvk.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-ios.tar
          tar xf /tmp/mvk.tar -C /tmp
          MVLIB=$(find /tmp/MoltenVK -name 'libMoltenVK.dylib' -path '*ios*' | head -1)
          echo "MVLIB=$MVLIB"
          if [ -n "$MVLIB" ]; then
            cp "$MVLIB" "$APP/Frameworks/libvulkan.dylib"
            echo "bundled libvulkan.dylib"
          else
            echo "WARN: MoltenVK lib not found"
          fi

          echo "=== Info.plist ==="
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>yaobow</string>
            <key>CFBundleDisplayName</key><string>仙剑 iOS (feasibility)</string>
            <key>CFBundleIdentifier</key><string>com.bikeltech.yaobow</string>
            <key>CFBundleExecutable</key><string>yaobow</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>MinimumOSVersion</key><string>12.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>metal</string><string>vulkan</string></array>
            <key>UILaunchScreen</key><dict></dict>
            <key>UIApplicationSupportsIndirectInputEvents</key><true/>
            <key>UISupportedInterfaceOrientations</key>
              <array>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
                <string>UIInterfaceOrientationPortrait</string>
              </array>
            <key>UIBackgroundModes</key><array><string>game</string></array>
          </dict>
          </plist>
          PLIST

          echo "=== .app contents ==="
          ls -laR "$APP" | head -50

          zip -r yaobow-unsigned.ipa Payload
          ls -la yaobow-unsigned.ipa

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaobow-ios-unsigned
          path: yaobow-unsigned.ipa
          if-no-files-found: warn
