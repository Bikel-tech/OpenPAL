name: iOS build (feasibility - hand-packed unsigned IPA)

on:
  push:
    branches: [ios-feasibility]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (pinned nightly for OpenPAL) + aarch64-apple-ios target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2024-07-01
          source "$HOME/.cargo/env"
          rustup default nightly-2024-07-01
          rustup target add aarch64-apple-ios
          rustc --version && cargo --version

      - name: Install glslang (shader compile used by radiance build.rs)
        run: |
          brew install glslang || true
          which glslangValidator || echo "WARN: glslangValidator not found"

      - name: Fetch MoltenVK for iOS (static lib or dylib) + diagnostics
        run: |
          set -euo pipefail
          # NOTE: never query the GitHub API here - unauthenticated calls are limited to
          # 60/hour and a 403 kills the whole build. Use known-good fixed release tags.
          MV_OK=0
          for tag in v1.4.2 v1.4.1 v1.4.0 v1.3.0 v1.2.11; do
            echo "trying MoltenVK tag $tag"
            if curl -fSL -o /tmp/mvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/$tag/MoltenVK-ios.tar"; then
              echo "MV_URL=https://github.com/KhronosGroup/MoltenVK/releases/download/$tag/MoltenVK-ios.tar"
              MV_OK=1
              break
            fi
            echo "tag $tag failed, trying next"
          done
          [ "$MV_OK" = "1" ] || { echo "ERR: all MoltenVK-ios.tar downloads failed"; exit 1; }
          echo "=== tar top-level entries ==="
          tar tf /tmp/mvk.tar | head -40 || true
          rm -rf /tmp/mvk && mkdir -p /tmp/mvk
          tar xf /tmp/mvk.tar -C /tmp/mvk
          echo "=== extracted MoltenVK libs ==="
          find /tmp/mvk -name 'libMoltenVK*' | head -20
          MV_A=$(find /tmp/mvk -name 'libMoltenVK.a' | head -1 || true)
          MV_DYLIB=$(find /tmp/mvk -name 'libMoltenVK.dylib' | head -1 || true)
          echo "MV_A=$MV_A"
          echo "MV_DYLIB=$MV_DYLIB"
          if [ -n "$MV_A" ]; then
            MVDIR=$(dirname "$MV_A")
            # iOS has no separate Vulkan loader; MoltenVK IS the implementation.
            # ash(loaded/linked) and the vma crate emit -lvulkan, so expose MoltenVK as libvulkan.a.
            cp -a "$MV_A" "$MVDIR/libvulkan.a" || ln -s "$MV_A" "$MVDIR/libvulkan.a"
            echo "MVDIR=$MVDIR" >> "$GITHUB_ENV"
            echo "MVK_STATIC=1" >> "$GITHUB_ENV"
            echo ">>> MODE=static (link libMoltenVK.a); provided libvulkan.a -> libMoltenVK.a for ash/vma 'vulkan' link"
          elif [ -n "$MV_DYLIB" ]; then
            echo "MVDIR=$(dirname "$MV_DYLIB")" >> "$GITHUB_ENV"
            echo "MV_DYLIB_PATH=$MV_DYLIB" >> "$GITHUB_ENV"
            echo "MVK_STATIC=0" >> "$GITHUB_ENV"
            echo ">>> MODE=dynamic (bundle dylib)"
          else
            echo "ERR: no MoltenVK library found inside MoltenVK-ios.tar"
            exit 1
          fi

      - name: Build yaobow for aarch64-apple-ios (release)
        run: |
          set -o pipefail
          source "$HOME/.cargo/env"
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export SDKROOT
          # MoltenVK references ___isPlatformVersionAtLeast, which libSystem only
          # exports on iOS 14+. Raise the deployment target so the linker can
          # resolve it (the target device is a modern iPhone anyway).
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          echo "SDKROOT=$SDKROOT  IPHONEOS_DEPLOYMENT_TARGET=$IPHONEOS_DEPLOYMENT_TARGET"
          if [ "${MVK_STATIC:-0}" = "1" ]; then
            echo ">>> static MoltenVK: linking libMoltenVK.a from $MVDIR"
            RF="-L native=$MVDIR -l static=MoltenVK -l c++ -l framework=Metal -l framework=Foundation -l framework=QuartzCore -l framework=UIKit -l framework=IOSurface -l framework=CoreGraphics -l framework=CoreFoundation"
            # libMoltenVK.a references ___isPlatformVersionAtLeast. rustc links with
            # -dead_strip, which drops our Rust shim (no reachable caller). Force the
            # linker to load the object that defines it via -u (treat as undefined/forced-load).
            RF="$RF -Clink-arg=-u___isPlatformVersionAtLeast"
            export RUSTFLAGS="$RF"
            echo "RUSTFLAGS=$RUSTFLAGS"
          else
            echo ">>> dynamic MoltenVK path (no extra link flags)"
          fi
          cargo build -p yaobow --bin yaobow --target aarch64-apple-ios --release 2>&1 | tail -60
          BIN=$(find target/aarch64-apple-ios/release -maxdepth 1 -type f -name yaobow | head -1 || true)
          echo "BIN=$BIN"
          [ -n "$BIN" ] || { echo "NO BINARY BUILT"; exit 1; }
          ls -la "$BIN"
          file "$BIN" || true

      - name: Hand-pack unsigned IPA
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          BIN=$(find target/aarch64-apple-ios/release -maxdepth 1 -type f -name yaobow | head -1 || true)
          APP=Payload/yaobow.app
          rm -rf Payload "$APP"
          mkdir -p "$APP/Frameworks"
          cp "$BIN" "$APP/yaobow"
          chmod +x "$APP/yaobow"

          echo "=== packaging assets (submodule dir -> yaobow-assets.zip) ==="
          pushd yaobow/yaobow-assets
          zip -r "$GITHUB_WORKSPACE/$APP/yaobow-assets.zip" . -x '*.git*'
          popd
          ls -la "$APP/yaobow-assets.zip"

          echo "=== bundling MoltenVK if dynamic ==="
          if [ "${MVK_STATIC:-0}" = "0" ] && [ -n "${MV_DYLIB_PATH:-}" ] && [ -f "${MV_DYLIB_PATH:-}" ]; then
            cp "$MV_DYLIB_PATH" "$APP/Frameworks/libMoltenVK.dylib"
            cp "$MV_DYLIB_PATH" "$APP/Frameworks/libvulkan.dylib"
            xcrun install_name_tool -add_rpath @executable_path/Frameworks "$APP/yaobow" || echo "WARN: add_rpath failed"
            echo "bundled MoltenVK dylib (both names)"
          else
            echo "static MoltenVK: nothing to bundle (linked into the executable)"
            rmdir "$APP/Frameworks" 2>/dev/null || true
          fi

          echo "=== Info.plist ==="
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>yaobow</string>
            <key>CFBundleDisplayName</key><string>仙剑 iOS (feasibility)</string>
            <key>CFBundleIdentifier</key><string>com.bikeltech.yaobow</string>
            <key>CFBundleExecutable</key><string>yaobow</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>MinimumOSVersion</key><string>12.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string><string>metal</string></array>
            <key>UILaunchScreen</key><dict></dict>
            <key>UIApplicationSupportsIndirectInputEvents</key><true/>
            <key>UISupportedInterfaceOrientations</key>
              <array>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
                <string>UIInterfaceOrientationPortrait</string>
              </array>
            <key>UIBackgroundModes</key><array><string>game</string></array>
          </dict>
          </plist>
          PLIST

          echo "=== .app contents ==="
          ls -laR "$APP" | head -60

          zip -r yaobow-unsigned.ipa Payload
          ls -la yaobow-unsigned.ipa

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaobow-ios-unsigned
          path: yaobow-unsigned.ipa
          if-no-files-found: warn
