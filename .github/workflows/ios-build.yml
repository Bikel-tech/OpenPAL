name: iOS build (feasibility - compile)

on:
  push:
    branches: [ios-feasibility]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly + aarch64-apple-ios target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version && cargo --version

      - name: Install Vulkan SDK (provides glslc for shader compilation)
        run: |
          # The lunarg download 302-redirects to a CDN; -L is required or we save the
          # HTML redirect page as the .dmg and hdiutil rejects it ("image not recognized").
          curl -fSL --retry 3 -o vulkansdk.dmg \
            https://sdk.lunarg.com/sdk/download/1.2.198.1/mac/vulkansdk-macos-1.2.198.1.dmg
          echo "--- downloaded file type ---"
          file vulkansdk.dmg
          sudo hdiutil attach vulkansdk.dmg
          sudo /Volumes/vulkansdk-macos-1.2.198.1/InstallVulkan.app/Contents/MacOS/InstallVulkan \
            --root "$HOME/VulkanSDK/1.2.198.1" --accept-licenses --default-answer --confirm-command install
          GLSLC=$(find "$HOME/VulkanSDK" -name glslc -type f | head -1)
          echo "GLSLC=$GLSLC"
          test -n "$GLSLC" && echo "$(dirname "$GLSLC")" >> "$GITHUB_PATH"

      - name: Build yaobow for aarch64-apple-ios (release)
        run: |
          source "$HOME/.cargo/env"
          which glslc || echo "WARN: glslc not on PATH"
          cargo build -p yaobow --target aarch64-apple-ios --release 2>&1 | tee build.log | tail -80

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
